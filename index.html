<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goal It Up — Personal Life & Productivity OS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
  
  <!-- Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="app-container">
    <!-- 1. Sidebar Navigation -->
    <aside class="app-sidebar">
      <div>
        <!-- Brand / Logo -->
        <div class="brand-section">
          <div class="brand-logo-icon">🌿</div>
          <div class="brand-info">
            <h1>Goal It Up</h1>
            <span>Productivity OS</span>
          </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="nav-menu">
          <button class="nav-item active" data-view="dashboard">
            <span class="nav-item-icon">🏛</span>
            <span>Dashboard</span>
          </button>

          <button class="nav-item" data-view="tasks">
            <span class="nav-item-icon">📋</span>
            <span>My Tasks</span>
            <span class="nav-badge" id="nav-task-badge" style="display:none;">0</span>
          </button>

          <button class="nav-item" data-view="habits">
            <span class="nav-item-icon">🌱</span>
            <span>Habits</span>
          </button>

          <button class="nav-item" data-view="goals">
            <span class="nav-item-icon">🎯</span>
            <span>Goals</span>
          </button>

          <button class="nav-item" data-view="calendar">
            <span class="nav-item-icon">📅</span>
            <span>Calendar</span>
          </button>

          <button class="nav-item" data-view="focus">
            <span class="nav-item-icon">⏱</span>
            <span>Focus & Timer</span>
          </button>

          <!-- Advanced Life Management & Growth -->
          <div style="font-size:0.68rem; text-transform:uppercase; color:var(--text-subtle); font-weight:700; padding:12px 14px 4px; letter-spacing:0.06em;">
            Life Architecture
          </div>

          <button class="nav-item" data-view="planner">
            <span class="nav-item-icon">🧭</span>
            <span>Smart Planner</span>
          </button>

          <button class="nav-item" data-view="balance">
            <span class="nav-item-icon">☸️</span>
            <span>Life Balance</span>
          </button>

          <button class="nav-item" data-view="reset">
            <span class="nav-item-icon">🔄</span>
            <span>Weekly Reset</span>
          </button>

          <button class="nav-item" data-view="rewards">
            <span class="nav-item-icon">🏅</span>
            <span>Achievements</span>
          </button>

          <button class="nav-item" data-view="vision">
            <span class="nav-item-icon">🌌</span>
            <span>Vision Board</span>
          </button>

          <!-- Insights & Mindset -->
          <div style="font-size:0.68rem; text-transform:uppercase; color:var(--text-subtle); font-weight:700; padding:12px 14px 4px; letter-spacing:0.06em;">
            Insights & Mindset
          </div>

          <button class="nav-item" data-view="analytics">
            <span class="nav-item-icon">📊</span>
            <span>Analytics</span>
          </button>

          <button class="nav-item" data-view="journal">
            <span class="nav-item-icon">💭</span>
            <span>Journal & Notes</span>
          </button>

          <button class="nav-item" data-view="settings">
            <span class="nav-item-icon">⚙️</span>
            <span>Settings</span>
          </button>
        </nav>
      </div>

      <!-- User Profile & Quick Theme Switcher -->
      <div class="sidebar-footer">
        <div class="user-quick-profile" onclick="App.navigateTo('settings')">
          <div class="user-avatar" id="user-avatar-display">🌿</div>
          <div class="user-details">
            <h4 id="user-name-display">Sara</h4>
            <span id="user-title-display">Lifelong Learner</span>
          </div>
        </div>
        <button class="quick-theme-toggle" id="quick-theme-btn" title="Toggle Light / Dark mode">🌓</button>
      </div>
    </aside>

    <!-- Mobile Sidebar Backdrop -->
    <div class="mobile-sidebar-backdrop" id="mobile-sidebar-backdrop" onclick="App.closeMobileSidebar()"></div>

    <!-- 2. Main Content Area -->
    <main class="app-main">
      <!-- Top Application Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-toggle">☰</button>
          <div class="current-view-title" id="view-title-display">🌿 Daily Command Center</div>
        </div>

        <div class="header-right">
          <button class="btn-secondary" style="border-radius:var(--radius-full); font-size:0.8rem; padding:6px 14px; border-color:var(--pastel-teal-border); color:var(--pastel-teal-text); display:flex; align-items:center; gap:6px;" onclick="App.navigateTo('overwhelmed')" title="Switch to Overwhelmed Mode (Top 3 Priorities & Single Focus)">
            <span>🍃</span>
            <span>Overwhelmed?</span>
          </button>
          <div class="date-badge">
            <span>📅</span>
            <span id="header-live-date">Today</span>
          </div>
          <button class="header-action-btn" id="global-add-btn">
            <span>+</span>
            <span>Quick Add</span>
          </button>
        </div>
      </header>

      <!-- View Sections Viewport -->
      <div class="views-viewport">
        <section id="dashboard-view" class="view-section active"></section>
        <section id="tasks-view" class="view-section"></section>
        <section id="habits-view" class="view-section"></section>
        <section id="goals-view" class="view-section"></section>
        <section id="calendar-view" class="view-section"></section>
        <section id="focus-view" class="view-section"></section>
        <section id="planner-view" class="view-section"></section>
        <section id="balance-view" class="view-section"></section>
        <section id="reset-view" class="view-section"></section>
        <section id="rewards-view" class="view-section"></section>
        <section id="vision-view" class="view-section"></section>
        <section id="overwhelmed-view" class="view-section"></section>
        <section id="analytics-view" class="view-section"></section>
        <section id="journal-view" class="view-section"></section>
        <section id="settings-view" class="view-section"></section>
      </div>
    </main>
  </div>

  <!-- Global Modal Dialog Overlay -->
  <div class="modal-overlay" id="global-modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Modal Title</h3>
        <button class="modal-close-btn" onclick="App.closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body-container">
        <!-- Injected via App.showModal() -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/focus.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/lifebalance.js"></script>
  <script src="js/weeklyreset.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/vision.js"></script>
  <script src="js/overwhelmed.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
